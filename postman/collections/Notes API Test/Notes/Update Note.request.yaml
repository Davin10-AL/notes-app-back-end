$kind: http-request
url: localhost:3000/notes/{{noteId}}
method: PUT
body:
  type: json
  content: "{\r

    \    \"title\": \"Catatan A Revised\",\r

    \    \"tags\": [\"Android\", \"Web\"],\r

    \    \"body\": \"Isi dari Catatan A Revised\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "// test 1 respon 200\r

      \r

      pm.test('response status code should have 200 value', () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      // test 2\r

      pm.test('response Content-Type header should have application/json value',
      () => {\r

      \   pm.expect(pm.response.headers.get('Content-Type')).to.equals(\"applic\
      ation/json; charset=utf-8\");\r

      }); \r

      \r

      // test 3\r

      pm.test('response body should be an object', () => {\r

      \   const responseJson = pm.response.json();\r

      \   pm.expect(responseJson).to.be.an('object');\r

      });\r

      \r

      // test 4\r

      pm.test('response body should have correct property and value', () => {\r

      \   const responseJson = pm.response.json();\r

      \ \r

      \   pm.expect(responseJson).to.have.ownProperty('status');\r

      \   pm.expect(responseJson.status).to.equals('success');\r

      \   pm.expect(responseJson).to.have.ownProperty('message');\r

      \   pm.expect(responseJson.message).to.equals('Catatan berhasil
      diperbarui');\r

      });\r

      \r

      // test 5\r

      pm.test('when request the updated note', () => {\r

      \    const noteId = pm.environment.get('noteId');\r

      \    pm.sendRequest(`http://localhost:3000/notes/${noteId}`, (error,
      response) => {\r

      \        if(!error) {\r

      \            pm.test('then the updated note should contain the latest
      data', () => {\r

      \              const responseJson = response.json();\r

      \              const note = responseJson.data.note;\r

      \                \r

      \              const expectedTitle = 'Catatan A Revised';\r

      \              const expectedTags = ['Android', 'Web'];\r

      \              const expectedBody = 'Isi dari Catatan A Revised';\r

      \ \r

      \              pm.expect(note.title).to.eql(expectedTitle);\r

      \              pm.expect(note.tags).to.eql(expectedTags);\r

      \              pm.expect(note.body).to.eql(expectedBody);\r

      \            });\r

      \        }\r

      \    });\r

      });"
    language: text/javascript
order: 5000
