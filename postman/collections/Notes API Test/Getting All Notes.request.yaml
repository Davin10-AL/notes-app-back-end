$kind: http-request
url: localhost:3000/notes?title=Catatan A&title=Android
method: GET
queryParams:
  - key: title
    value: Catatan A
    disabled: false
    description: ""
  - key: title
    value: Android
    disabled: false
    description: ""
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: "//test 1 response status code should have 200 value\r

      pm.test('response status code should have 200 value', () => {\r

      \   pm.response.to.have.status(200);\r

      });\r

      \r

      // test 2 response Content-Type header should have application/json value\r

      pm.test('response Content-Type header should have application/json value', () => {\r

      \   pm.expect(pm.response.headers.get('Content-Type')).to.equals('application/json; charset=utf-8');\r

      }); \r

      \r

      // test 3 response body should an object\r

      pm.test('response body should an object', () => {\r

      \   const responseJson = pm.response.json();\r

      \   pm.expect(responseJson).to.be.an('object');\r

      }); \r

      \r

      // test 4 response body should have the correct property and value\r

      pm.test('response body should have the correct property and value', () => {\r

      \  const responseJson = pm.response.json();\r

      \   pm.expect(responseJson).to.have.ownProperty('status');\r

      \   pm.expect(responseJson.status).to.equals('success');\r

      \   pm.expect(responseJson).to.have.ownProperty('data');\r

      \   pm.expect(responseJson.data).to.be.an('object');\r

      }); \r

      \r

      // test 5 \r

      \r

      pm.test('response body data should have a notes array and contain at least 1 item', () => {\r

      \   const responseJson = pm.response.json();\r

      \   const { data } = responseJson;\r

      \ \r

      \   pm.expect(data).to.have.ownProperty('notes');\r

      \   pm.expect(data.notes).to.be.an('array');\r

      \   pm.expect(data.notes).lengthOf.at.least(1);\r

      }); "
    language: text/javascript
order: 2000
