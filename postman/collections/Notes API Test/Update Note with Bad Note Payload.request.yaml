$kind: http-request
url: localhost:3000/notes/{{noteId}}
method: PUT
body:
  type: json
  content: "{{currentBadNotePayload}}"
scripts:
  - type: beforeRequest
    code: "let badNotePayloads = pm.environment.get('badNotePayloads');  // ini akan
      bertipe Array\r

      \ \r

      if (!badNotePayloads || badNotePayloads.length === 0) {\r

      \  // inisialisasi dengan sejumlah note yang tidak sesuai\r

      \  badNotePayloads = [\r

      \   { tags: [\"Android\", \"Web\"], body: \"Isi dari catatan A\" },\r

      \   { title: 1, tags: [\"Android\", \"Web\"], body: \"Isi dari catatan A\"
      },\r

      \   { title: \"Catatan A\", body: \"Isi dari catatan A\" },\r

      \   { title: \"Catatan A\", tags: [1, \"2\"], body: \"Isi dari catatan A\"
      },\r

      \   { title: \"Catatan A\", tags: [\"Android\", \"Web\"] },\r

      \   { title: \"Catatan A\", tags: [\"Android\", \"Web\"], body: true }\r

      \ ]\r

      }\r

      \ \r

      const currentBadNotePayload = badNotePayloads.shift();  // hapus index 0,
      geser sisanya\r

      pm.environment.set('currentBadNotePayload',
      JSON.stringify(currentBadNotePayload));\r

      pm.environment.set('badNotePayloads', badNotePayloads);"
    language: text/javascript
  - type: afterResponse
    code: "pm.test('response status code should have 400 value', () => {\r

      \  pm.response.to.have.status(400);\r

      });\r

      \ \r

      pm.test('response Content-Type header should have application/json;
      charset=utf-8 value', () => {\r

      \ 
      pm.expect(pm.response.headers.get('Content-Type')).to.equals('application\
      /json; charset=utf-8');\r

      });\r

      \ \r

      pm.test('response body should be an object', () => {\r

      \  const responseJson = pm.response.json();\r

      \  pm.expect(responseJson).to.be.an('object');\r

      });\r

      \ \r

      pm.test('response body object should have correct property and value', ()
      => {\r

      \  const responseJson = pm.response.json();\r

      \  pm.expect(responseJson).to.haveOwnProperty('status');\r

      \  pm.expect(responseJson.status).to.equals('failed');\r

      \  pm.expect(responseJson).to.haveOwnProperty('message');\r

      \  pm.expect(responseJson.message).to.be.ok;\r

      });\r

      \ \r

      const repeatRequestUntilDatasetEmpty = () => {\r

      \  const badNotePayloads = pm.environment.get('badNotePayloads');\r

      \ \r

      \  if(badNotePayloads && badNotePayloads.length > 0) {\r

      \   postman.setNextRequest('Update Note with Bad Note Payload');\r

      \  }\r

      }\r

      \ \r

      repeatRequestUntilDatasetEmpty();"
    language: text/javascript
order: 4108
